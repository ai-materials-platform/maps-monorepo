# Render 블루프린트 — 재료 챗봇 게이트웨이 (apps/gateway/README.md 참고)
services:
  - type: web
    name: maps-chat-gateway
    runtime: python
    rootDir: apps/gateway
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app_from_env --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: UPSTREAM_BASE_URL
        value: https://api.deepinfra.com/v1/openai
      - key: UPSTREAM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: deepseek-ai/DeepSeek-V4.1-Flash
      - key: GUARD_MODEL
        value: deepseek-ai/DeepSeek-V4.1-Flash
      - key: EMBED_MODEL
        value: BAAI/bge-m3
      - key: ACCESS_CODE_HASHES
        sync: false
      - key: PRICE_IN_PER_M
        value: "0.14"
      - key: PRICE_OUT_PER_M
        value: "0.42"
      - key: MONTHLY_CAP_USD
        value: "10"
      - key: RATE_PER_HOUR
        value: "30"
      - key: RATE_PER_DAY
        value: "200"
